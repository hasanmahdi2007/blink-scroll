# Blink Scroll settings. Edit, then choose 'Reload config' from the tray or circle menu.
# Delete this file to restore defaults. See README.md for a tuning guide.

[camera]
index = 0
backend = "dshow"
width = 640
height = 480
fps = 30

[processing]
fps = 15.0
inference_width = 320
low_power_after_s = 10.0
low_power_fps = 4.0
model_path = ""

[calibration]
open_seconds = 3.0
closed_seconds = 1.5
use_closed_phase = true
closed_fraction = 0.6
open_fraction = 0.35
closed_offset = 0.35
open_offset = 0.18
min_contrast = 0.2
adapt_rate = 0.002

[detection]
smoothing_alpha = 0.6
min_closed_frames = 2
cooldown_s = 1.0

[gestures.double_blink]
enabled = true
window_s = 0.7
direction = "down"

[gestures.long_blink]
enabled = false
min_duration_s = 0.5
direction = "down"

[gestures.wink]
enabled = false
open_eye_margin = 0.1
min_duration_s = 0.15
left_direction = "up"
right_direction = "down"

[head_pose]
enabled = true
max_yaw_deg = 20.0
max_pitch_up_deg = 20.0
max_pitch_down_deg = 15.0
max_roll_deg = 20.0

[scroll]
amount = 5
steps = 5
duration_s = 0.15

[hotkeys]
toggle = "<ctrl>+<alt>+b"
quit = "<ctrl>+<alt>+q"
recalibrate = "<ctrl>+<alt>+c"

[widget]
enabled = true
size = 44
edge = "right"
y_fraction = 0.5
peek_px = 10
hide_delay_s = 1.5
