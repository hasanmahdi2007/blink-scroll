name: release

# Push a tag like v1.2.0 -> builds BlinkScroll.exe (PyInstaller) and the installer (Inno Setup)
# on Windows and attaches BlinkScroll-Setup-<version>.exe to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Test
        run: python -m pytest -q
      - name: Download face model
        run: python -m blinkscroll.download_model
      - name: Build app
        run: python -m PyInstaller packaging/blinkscroll.spec --noconfirm
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') { $version = "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BlinkScroll-Setup
          path: dist/BlinkScroll-Setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Blink Scroll $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/BlinkScroll-Setup-*.exe --clobber
